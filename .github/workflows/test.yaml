name: build and test

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev, master ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '.github/workflows/*'

env:
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use

jobs:
  test-windows:
    name: test-windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup build environment
      uses: ./.github/actions/setup-build-environment
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    #One step per test project: a multi-command pwsh step only reports the exit code of its last
    #command, so a failure in an earlier project would leave the job green.
    #Every project runs even when an earlier one fails, so a single run shows all failures.
    - name: Test unit tests
      if: ${{ !cancelled() }}
      run: dotnet test Tests/COMPASS.UnitTests --no-restore -v normal

    - name: Test common integration tests
      if: ${{ !cancelled() }}
      run: dotnet test Tests/COMPASS.IntegrationTests.Common --no-restore -v normal

    - name: Test windows integration tests
      if: ${{ !cancelled() }}
      run: dotnet test Tests/COMPASS.IntegrationTests.Windows --no-restore -v normal

    - name: Smoke test - launch app and verify it survives startup
      shell: pwsh
      run: |
        dotnet publish Source/COMPASS.Windows/COMPASS.Windows.csproj --configuration Release --no-restore -o publish/win-x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $compassProcess = Start-Process -FilePath ".\publish\win-x64\COMPASS.exe" -PassThru
        Start-Sleep -Seconds 12
        if ($compassProcess.HasExited) {
          Write-Output "::error::COMPASS exited within 12s of launch - likely crashed during startup"
          exit 1
        }
        Write-Output "COMPASS was still running after 12s, startup succeeded"
        Stop-Process -Id $compassProcess.Id -Force

    - name: Upload Log Artifact
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: log-file-windows
        path: C:\Users\runneradmin\AppData\Local\COMPASS\logs

  test-linux:
    name: test-linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup build environment
      uses: ./.github/actions/setup-build-environment
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    #One step per test project so a failure in any of them fails the job.
    #Every project runs even when an earlier one fails, so a single run shows all failures.
    - name: Test unit tests
      if: ${{ !cancelled() }}
      run: dotnet test Tests/COMPASS.UnitTests --no-restore -v normal

    - name: Test common integration tests
      if: ${{ !cancelled() }}
      run: dotnet test Tests/COMPASS.IntegrationTests.Common --no-restore -v normal

    - name: Test linux integration tests
      if: ${{ !cancelled() }}
      run: dotnet test Tests/COMPASS.IntegrationTests.Linux --no-restore -v normal

    - name: Smoke test - launch app and verify it survives startup
      run: |
        dotnet publish Source/COMPASS.Linux/COMPASS.Linux.csproj --configuration Release --no-restore -o publish/linux-x64
        timeout 60s xvfb-run -a ./publish/linux-x64/COMPASS &
        APP_PID=$!
        sleep 12
        if ! kill -0 "$APP_PID" 2>/dev/null; then
          echo "::error::COMPASS terminated within 12s of launch - likely crashed during startup"
          exit 1
        fi
        echo "COMPASS was still running after 12s, startup succeeded"

    - name: Stop smoke test app
      if: always()
      run: pkill -f "publish/linux-x64/COMPASS" || true

    - name: Verify native OpenCv library matches the target architecture
      run: file -L publish/linux-x64/libOpenCvSharpExtern.so | grep -q "x86-64"

    - name: Upload Log Artifact
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: log-file-linux
        path: /home/runner/.local/share/COMPASS/logs

  #The test projects are pinned to linux-x64, so on arm64 only publish and smoke test the app.
  smoke-test-linux-arm64:
    name: smoke-test-linux-arm64
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Restore dependencies
      run: dotnet restore Source/COMPASS.Linux/COMPASS.Linux.csproj --runtime linux-arm64 --locked-mode

    - name: Publish
      run: dotnet publish Source/COMPASS.Linux/COMPASS.Linux.csproj --configuration Release --runtime linux-arm64 --self-contained true --no-restore -o publish/linux-arm64

    - name: Verify native OpenCv library matches the target architecture
      run: file -L publish/linux-arm64/libOpenCvSharpExtern.so | grep -q "aarch64"

    - name: Smoke test - launch app and verify it survives startup
      run: |
        timeout 60s xvfb-run -a ./publish/linux-arm64/COMPASS &
        APP_PID=$!
        sleep 12
        if ! kill -0 "$APP_PID" 2>/dev/null; then
          echo "::error::COMPASS terminated within 12s of launch - likely crashed during startup"
          exit 1
        fi
        echo "COMPASS was still running after 12s, startup succeeded"

    - name: Stop smoke test app
      if: always()
      run: pkill -f "publish/linux-arm64/COMPASS" || true

    - name: Upload Log Artifact
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: log-file-linux-arm64
        path: /home/runner/.local/share/COMPASS/logs
