name: Create release

permissions:
  contents: write
  actions: read

on: 
  workflow_dispatch:
    inputs:
      branch:
        description: 'the branch to checkout'
        required: true
        type: string

jobs:
  get-version:
    name: Get version from Directory.Build.props
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch }}
    - name: Extract version
      id: extract
      run: |
        VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

  package-windows:
    name: Create and sign windows installer
    needs: get-version
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with: 
        ref: ${{ inputs.branch }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: dotnet publish Source/COMPASS.Windows/COMPASS.Windows.csproj --configuration Release -r win-x64 --self-contained true -o .\publish\win-x64\
      
      #upload the main exe so it can be signed
    - name: Upload app exe
      id: upload-exe
      uses: actions/upload-artifact@v7
      with:
        name: COMPASS_exe
        path: .\publish\win-x64\COMPASS.exe

    - name: remove unsigned exe
      shell: pwsh
      run: rm .\publish\win-x64\COMPASS.exe

    - name: Sign app
      id: signing-app
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 2f2c8b60-b250-4dd2-8827-045fa9cc65e6
        project-slug: COMPASS
        signing-policy-slug: release-signing 
        github-artifact-id: ${{steps.upload-exe.outputs.artifact-id}}
        wait-for-completion: true
        output-artifact-directory: .\publish\win-x64\

    - name: Package
      run: iscc Deployment/install.iss

    - name: Upload installer
      id: upload-installer
      uses: actions/upload-artifact@v7
      with:
        name: COMPASS_Installer
        path: .\Deployment\Versions\${{ needs.get-version.outputs.version }}\COMPASS_Setup_${{ needs.get-version.outputs.version }}.exe

    - name: Sign installer
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 2f2c8b60-b250-4dd2-8827-045fa9cc65e6
        project-slug: COMPASS
        signing-policy-slug: release-signing
        github-artifact-id: ${{steps.upload-installer.outputs.artifact-id}}
        wait-for-completion: true
        output-artifact-directory: .\Deployment\Versions\${{ needs.get-version.outputs.version }}\

    - name: Upload signed installer
      uses: actions/upload-artifact@v7
      with:
        name: COMPASS_Installer_Signed
        path: .\Deployment\Versions\${{ needs.get-version.outputs.version }}\COMPASS_Setup_${{ needs.get-version.outputs.version }}.exe

  package-flatpak:
    name: Create Flatpak bundle
    needs: get-version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch }}

    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: COMPASS_${{ needs.get-version.outputs.version }}.flatpak
        manifest-path: Deployment/flatpak/info.compassapp.COMPASS.yaml
        cache-key: flatpak-builder-${{ github.sha }}

    - name: Upload Flatpak
      uses: actions/upload-artifact@v7
      with:
        name: COMPASS_Flatpak
        path: COMPASS_${{ needs.get-version.outputs.version }}.flatpak

  draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [get-version, package-windows, package-flatpak]

    steps:
    - name: Download Windows installer
      uses: actions/download-artifact@v4
      with:
        name: COMPASS_Installer_Signed
        path: release-files/

    - name: Download Flatpak
      uses: actions/download-artifact@v4
      with:
        name: COMPASS_Flatpak
        path: release-files/

    - name: Create draft release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.get-version.outputs.version }}
        name: COMPASS v${{ needs.get-version.outputs.version }}
        target_commitish: ${{ inputs.branch }}
        draft: true
        prerelease: ${{ contains(needs.get-version.outputs.version, '-') }}
        files: release-files/*
