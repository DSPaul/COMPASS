name: Create Installer

permissions:
  contents: read
  actions: read

on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (*.*.*), no prefix'
        required: true
        type: string
      branch:
        description: 'the branch to checkout'
        required: true
        type: string

jobs:
  build:
    name: Build, package and Sign
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with: 
        ref: ${{ inputs.branch }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish Source/COMPASS.Windows/COMPASS.Windows.csproj --configuration Release --no-restore -o .\src\bin\Publish\win-x64\
      
      #upload the main exe so it can be signed
    - name: Upload app exe
      id: upload-exe
      uses: actions/upload-artifact@v7
      with:
        name: COMPASS_exe
        path: .\src\bin\Publish\win-x64\COMPASS.Windows.exe

    - name: remove unsigned exe
      shell: pwsh
      run: rm .\src\bin\Publish\win-x64\COMPASS.Windows.exe

    - name: Sign app
      id: signing-app
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 2f2c8b60-b250-4dd2-8827-045fa9cc65e6
        project-slug: COMPASS
        signing-policy-slug: release-signing 
        github-artifact-id: ${{steps.upload-exe.outputs.artifact-id}}
        wait-for-completion: true
        output-artifact-directory: .\src\bin\Publish\win-x64\

    - name: Package
      run: iscc Deployment/install.iss

    - name: Upload installer
      id: upload-installer
      uses: actions/upload-artifact@v7
      with:
        name: COMPASS_Installer
        path: .\Deployment\Versions\${{ inputs.version }}\COMPASS_Setup_${{ inputs.version }}.exe

    - name: Sign installer
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 2f2c8b60-b250-4dd2-8827-045fa9cc65e6
        project-slug: COMPASS
        signing-policy-slug: release-signing
        github-artifact-id: ${{steps.upload-installer.outputs.artifact-id}}
        wait-for-completion: false

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch }}

    - name: Build Flatpak
      uses: flatpak/github-actions/flatpak-builder@v6
      with:
        bundle: COMPASS_${{ inputs.version }}.flatpak
        manifest-path: Deployment/flatpak/info.compassapp.COMPASS.yaml
        cache-key: flatpak-builder-${{ github.sha }}

    - name: Upload Flatpak
      uses: actions/upload-artifact@v7
      with:
        name: COMPASS_Flatpak
        path: COMPASS_${{ inputs.version }}.flatpak
