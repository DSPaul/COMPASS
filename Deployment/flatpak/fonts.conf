<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Workaround for https://github.com/mono/SkiaSharp/issues/5210 (COMPASS #112).
  Skia's fontconfig font manager loops forever on font entries without a family name,
  which fontconfig produces for some WOFF/WOFF2 web fonts, hanging the app at startup.
  - Reject web font containers, Skia can't use them anyway.
  - Use a private cache dir (listed first so it is written and read first), so a
    poisoned shared fontconfig cache can't bring the bad entries back.
  Remove once SkiaSharp ships the upstream fix.
-->
<fontconfig>
  <cachedir prefix="xdg">fontconfig-compass</cachedir>

  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
      <glob>*.WOFF</glob>
      <glob>*.WOFF2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
