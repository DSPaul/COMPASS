app-id: info.compassapp.COMPASS
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: COMPASS

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/sdk/dotnet10/lib/pkgconfig


modules:
  - name: compass
    buildsystem: simple
    build-commands:
      - dotnet publish Source/COMPASS.Linux/COMPASS.Linux.csproj
          --configuration Release
          --runtime linux-x64 
          --self-contained true 
          --source ./nuget-sources
          --output /app/bin/
      - install -Dm644 Deployment/flatpak/info.compassapp.COMPASS.desktop ${FLATPAK_DEST}/share/applications/info.compassapp.COMPASS.desktop
      - install -Dm644 Deployment/flatpak/info.compassapp.COMPASS.metainfo.xml ${FLATPAK_DEST}/share/metainfo/info.compassapp.COMPASS.metainfo.xml
      - install -Dm644 Deployment/flatpak/info.compassapp.COMPASS-mime.xml ${FLATPAK_DEST}/share/mime/packages/info.compassapp.COMPASS.xml
      - install -Dm644 Source/COMPASS.Common/Assets/COMPASS_Icon-512x512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/info.compassapp.COMPASS.png

    sources:
      - type: git
        url: https://github.com/DSPaul/COMPASS
        branch: Avalonia
      - nuget-sources.json