app-id: info.compassapp.COMPASS
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: COMPASS

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --env=DOTNET_ROOT=/app/lib/dotnet

modules:
  - name: compass
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/DSPaul/COMPASS
        branch: Avalonia
      - nuget-sources.json
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
      env:
        DOTNET_ROOT: /usr/lib/sdk/dotnet10
    build-commands:
      - dotnet publish Source/COMPASS.Linux/COMPASS.Linux.csproj
          --configuration Release
          --no-self-contained
          --source ./nuget-sources
          -o publish/
      - mkdir -p ${FLATPAK_DEST}/bin
      - cp -r publish/* ${FLATPAK_DEST}/bin
      - install -Dm644 Deployment/flatpak/info.compassapp.COMPASS.desktop ${FLATPAK_DEST}/share/applications/info.compassapp.COMPASS.desktop
      - install -Dm644 Deployment/flatpak/info.compassapp.COMPASS.metainfo.xml ${FLATPAK_DEST}/share/metainfo/info.compassapp.COMPASS.metainfo.xml
      - install -Dm644 Source/COMPASS.Common/Assets/COMPASS_Icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/info.compassapp.COMPASS.png